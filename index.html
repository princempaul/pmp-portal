<script>

   Fill in after creating the Supabase project (see DEPLOY.md). */

<style>
/* App shell: dense clinical UI in the site's midnight / ivory / gold family. */
:root{
  --mid:#0c1626;--mid-2:#13213a;--mid-3:#1b2d4b;
  --ivory:#f8f5ef;--ivory-2:#efe9de;--paper:#ffffff;
  --gold:#c6a46a;--gold-deep:#9f7f47;--gold-soft:#e3cfa6;
  --ink:#141b26;--muted:#5e6672;--muted-2:#8a919b;--line:#e2dbcd;--line-2:#ebe6dc;
  --ok:#2e7d4f;--ok-bg:#e6f3ea;--warn:#a86b0a;--warn-bg:#fcf1dc;--bad:#b3261e;--bad-bg:#fbe9e7;--info:#1f5fa8;--info-bg:#e7eff9;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Manrope",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --r:6px;color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
h1,h2{font-family:var(--display);font-weight:500;letter-spacing:0;line-height:1.1}
h1{font-size:1.9rem}h2{font-size:1.45rem}h3{font-size:1.05rem;font-weight:700}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;min-height:40px;padding:.5rem .7rem;border:1px solid var(--line);border-radius:var(--r);background:#fff}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:grid;gap:.3rem;font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
label > input,label > select,label > textarea{font-size:.95rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:40px;padding:.55rem 1rem;border-radius:var(--r);border:1px solid var(--mid);background:var(--mid);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--mid-3)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--mid)}
.btn.gold:hover{background:var(--gold-soft)}
.btn.ghost{background:transparent;color:var(--mid);border-color:var(--line)}
.btn.ghost:hover{background:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:.3rem .7rem;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.15rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mute{background:var(--ivory-2);color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.1rem;border-bottom:1px solid var(--line-2)}
.card-b{padding:1.1rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media (max-width:1100px){.g6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.g6{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.82rem}.mono{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--ivory)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--ivory)}
.table-wrap{overflow-x:auto}
.empty{padding:2rem;text-align:center;color:var(--muted)}
.notice{padding:.7rem .9rem;border-radius:var(--r);font-size:.88rem}
.notice.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #efd9a6}
.notice.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #f1c2bd}
.notice.info{background:var(--info-bg);color:var(--info);border:1px solid #c6d8ef}
.notice.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #bfe0c9}
hr.sep{border:0;border-top:1px solid var(--line);margin:1rem 0}

/* Demo banner */
.demo-bar{background:var(--bad);color:#fff;text-align:center;font-weight:700;font-size:.82rem;letter-spacing:.06em;padding:.45rem 1rem}
.demo-bar b{text-transform:uppercase}

/* Login */
.login{min-height:100%;display:grid;place-items:center;background:var(--mid);padding:1.5rem}
.login .box{width:min(420px,100%);background:var(--paper);border-radius:10px;padding:2rem;display:grid;gap:1rem}
.login .brand{display:flex;align-items:center;gap:.7rem;font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--mid)}
.login .mark{width:36px;height:36px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--body);font-size:.6rem;font-weight:800;letter-spacing:.12em;color:var(--gold-deep)}
.login .foot{text-align:center;color:#8fa0b5;font-size:.78rem;margin-top:1rem}

/* Shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.side{background:var(--mid);color:#dfe5ee;padding:1.1rem .9rem;display:flex;flex-direction:column;gap:.4rem;position:sticky;top:0;height:100vh;overflow:auto}
@media (max-width:900px){.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:.7rem}}
.side .brand{display:flex;align-items:center;gap:.6rem;color:#fff;font-family:var(--display);font-size:1.25rem;font-weight:600;padding:.4rem .5rem 1rem;text-decoration:none}
.side .mark{width:30px;height:30px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--body);font-size:.55rem;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.side a.nav{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border-radius:var(--r);color:#cfd6e0;text-decoration:none;font-weight:600;font-size:.9rem;min-height:40px}
.side a.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.nav.on{background:rgba(198,164,106,.18);color:var(--gold-soft)}
.side a.nav svg{width:18px;height:18px;flex:none}
.side .spacer{flex:1}
.side .user{padding:.7rem;border-top:1px solid rgba(255,255,255,.1);font-size:.82rem;color:#aeb8c6}
.side .user b{display:block;color:#fff}
@media (max-width:900px){.side .brand{padding:.2rem .4rem;font-size:1.1rem}.side a.nav{padding:.45rem .6rem;font-size:.82rem}.side .spacer,.side .user{display:none}}
.main{padding:1.4rem clamp(1rem,2.5vw,2rem) 4rem;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.page-h .sub{color:var(--muted);font-size:.9rem;margin-top:.2rem}
.kpi{display:grid;gap:.2rem;padding:1rem 1.1rem}
.kpi b{font-family:var(--display);font-size:2.2rem;font-weight:500;line-height:1;color:var(--mid)}
.kpi span{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tabs a{padding:.6rem .9rem;text-decoration:none;color:var(--muted);font-weight:600;font-size:.88rem;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--mid);border-color:var(--gold)}
.note{white-space:pre-wrap;font-size:.92rem;line-height:1.55}
.search{max-width:420px}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--ivory-2);border-radius:999px;padding:.2rem .6rem;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--mid);color:#fff;padding:.7rem 1.1rem;border-radius:var(--r);font-size:.9rem;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none;max-width:90vw}
.toast.show{display:block}
.modal-bg{position:fixed;inset:0;background:rgba(12,22,38,.55);display:none;place-items:center;z-index:40;padding:1rem}
.modal-bg.show{display:grid}
.modal{background:#fff;border-radius:10px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:1.4rem;display:grid;gap:1rem}
.modal.wide{width:min(980px,100%)}
.form{display:grid;gap:.9rem}
.form .g2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.form .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem}
@media (max-width:640px){.form .g2,.form .g3{grid-template-columns:1fr}}
.rxline{display:grid;grid-template-columns:2fr 1fr 2fr 1fr 1fr auto;gap:.5rem;align-items:end}
@media (max-width:900px){.rxline{grid-template-columns:1fr 1fr}}
.score{font-family:var(--display);font-size:1.6rem;color:var(--mid)}
.sig{border-top:1px dashed var(--line);padding-top:.6rem;margin-top:.6rem;font-size:.82rem;color:var(--muted)}
.lock{color:var(--ok);font-weight:700}
.audit td{font-size:.82rem}
.hidden{display:none!important}
.fieldset{border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:grid;gap:.8rem}
.fieldset > legend,.fieldset > .lg{font-family:var(--display);font-size:1.2rem;color:var(--mid);padding:0 .3rem}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.4rem}
.checks label{display:flex;align-items:center;gap:.5rem;text-transform:none;letter-spacing:0;font-weight:500;font-size:.9rem;color:var(--ink)}
.checks input{width:auto;min-height:0}
.rangerow{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center}
.printable{font-family:Georgia,serif}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<script>
(function(){
'use strict';
const CFG=window.PMP_CONFIG||{};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now().toString(36));
const now=()=>new Date().toISOString();
const fmtD=d=>d?new Date(d).toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'}):'';
const fmtDT=d=>d?new Date(d).toLocaleString('en-CA',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
const age=dob=>{if(!dob)return'';const b=new Date(dob),t=new Date();let a=t.getFullYear()-b.getFullYear();const m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate()))a--;return a;};
const toast=(m,ms=2600)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms);};
const DEMO=!CFG.supabaseUrl;

/* ================= DATA LAYER ================= */
const TABLES=['profiles','patients','encounters','assessments','documents','prescriptions','fax_jobs','inbound_faxes','appointments','web_requests','message_threads','messages','invoices','fee_schedule','audit_log'];
let session=null; // {user:{id,email}, profile}

// ---- Demo adapter (browser-only) ----
const demo={
  key:'pmp_demo_db_v1',
  db:null,
  load(){try{this.db=JSON.parse(localStorage.getItem(this.key)||'null')}catch(e){this.db=null}
    if(!this.db){this.db=seed();this.save();}
  },
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.db))}catch(e){}},
  async list(t,f={}){let rows=this.db[t]||[];Object.entries(f).forEach(([k,v])=>{rows=rows.filter(r=>r[k]===v)});return rows.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));},
  async get(t,id){return (this.db[t]||[]).find(r=>r.id===id)||null;},
  async insert(t,row){row={id:uid(),created_at:now(),updated_at:now(),owner_id:session.user.id,...row};(this.db[t]=this.db[t]||[]).push(row);this.save();audit('insert',t,row.id);return row;},
  async update(t,id,patch){const r=await this.get(t,id);if(!r)throw new Error('Not found');Object.assign(r,patch,{updated_at:now()});this.save();audit('update',t,id);return r;},
  async upload(path,file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{this.db._files=this.db._files||{};this.db._files[path]=fr.result;this.save();res(path)};fr.onerror=rej;fr.readAsDataURL(file);});},
  async fileUrl(path){return (this.db._files||{})[path]||'';},
  async fn(name,body){ // simulated server functions
    if(name==='send-fax'){const job=await this.insert('fax_jobs',{prescription_id:body.ref_type==='prescription'?body.ref_id:null,ref_type:body.ref_type||'adhoc',ref_id:body.ref_id||null,to_fax:body.to_fax,to_name:body.to_name||'',subject:body.subject||'',direction:'out',status:'queued_local',provider:'self',source:'portal',detail:'Queued for the clinic fax server (demo: no server connected)'});return {ok:true,job};}
    if(name==='create-video-room'){const room='PMP-'+Math.random().toString(36).slice(2,10);return {ok:true,provider:'jitsi',url:'https://meet.jit.si/'+room+'#config.prejoinPageEnabled=true',interim:true};}
    if(name==='fax-status'){return {ok:true,status:'queued_no_provider'};}
    if(name==='fax-inbox'){if(body&&body.retrieve){const inb=(this.db.inbound_faxes||[]).find(f=>f.provider_ref===body.retrieve);const doc=await this.insert('documents',{patient_id:body.patient_id,category:body.category||'Correspondence',description:body.description||('Inbound fax from '+(inb?.from_number||'')),filename:'fax-'+body.retrieve+'.pdf',size:0,mime:'application/pdf',path:'demo-inbound-'+body.retrieve});if(inb)await this.update('inbound_faxes',inb.id,{status:'filed',document_id:doc.id,patient_id:body.patient_id});return {ok:true,document:doc};}
      if(!(this.db.inbound_faxes||[]).length){await this.insert('inbound_faxes',{provider:'srfax',provider_ref:'20261019-0001',from_number:'519-555-0199',from_name:'EXAMPLE PHARMACY',received_at:now(),pages:1,status:'new',suggested_patient_id:'p-001',notified_at:now()});}return {ok:true,configured:false,items:await this.list('inbound_faxes')};}
    if(name==='secure-message-send'){let tid=body.thread_id;if(!tid){const t=await this.insert('message_threads',{patient_id:body.patient_id,subject:body.subject||'Message from PMP Healthcare',recipient_name:body.recipient_name||'',recipient_email:body.recipient_email,status:'open',last_message_at:now()});tid=t.id;}const m=await this.insert('messages',{thread_id:tid,sender:'clinician',sender_name:'PMP Healthcare',body:body.body,attachment_document_id:body.attachment_document_id||null});await this.update('message_threads',tid,{last_message_at:now(),status:'open'});return {ok:true,thread_id:tid,message:m,emailed:false,link:(CFG.portalUrl||'')+'/secure.html#demo-'+tid.slice(0,8)};}
    if(name==='create-payment'){const inv=await this.get('invoices',body.invoice_id);await this.update('invoices',inv.id,{status:'sent',issued_at:inv.issued_at||now(),pay_url:''});return {ok:true,pay_url:null,note:'Demo mode: Stripe not configured. Invoice marked sent.'};}
    return {ok:false,error:'Unknown function'};
  }
};

// ---- Supabase adapter ----
let sb=null;
const real={
  async list(t,f={}){let q=sb.from(t).select('*');Object.entries(f).forEach(([k,v])=>{q=q.eq(k,v)});const {data,error}=await q.order('created_at',{ascending:false});if(error)throw error;return data;},
  async get(t,id){const {data,error}=await sb.from(t).select('*').eq('id',id).maybeSingle();if(error)throw error;return data;},
  async insert(t,row){const {data,error}=await sb.from(t).insert({...row,owner_id:session.user.id}).select().single();if(error)throw error;return data;},
  async update(t,id,patch){const {data,error}=await sb.from(t).update(patch).eq('id',id).select().single();if(error)throw error;return data;},
  async upload(path,file){const {error}=await sb.storage.from('documents').upload(path,file,{upsert:false});if(error)throw error;return path;},
  async fileUrl(path){const {data,error}=await sb.storage.from('documents').createSignedUrl(path,600);if(error)throw error;return data.signedUrl;},
  async fn(name,body){const {data,error}=await sb.functions.invoke(name,{body});if(error)throw error;return data;}
};
const DB=DEMO?demo:real;
async function audit(action,table,row_id,meta){try{const row={action,table_name:table,row_id,meta:meta||null,actor:session?.user?.email||'system',created_at:now(),id:uid()};if(DEMO){(demo.db.audit_log=demo.db.audit_log||[]).push(row);demo.save();}else{await sb.from('audit_log').insert({action,table_name:table,row_id,meta:meta||null});}}catch(e){console.warn('audit',e)}}

function seed(){
  const o='demo-user';const t=now();
  const p1={id:'p-001',owner_id:o,created_at:t,updated_at:t,first_name:'Margaret',last_name:'Sample',dob:'1941-03-14',sex:'F',hcn:'',phone:'519-555-0101',email:'',address:'Sarnia, ON',setting:'Retirement residence',facility:'Example Retirement Residence',pcp:'Dr. Example (family physician)',pharmacy_name:'Example Pharmacy',pharmacy_fax:'519-555-0199',allergies:'Penicillin (rash)',problems:'Hypertension; Type 2 diabetes; Osteoarthritis; Mild cognitive impairment',medications:'Amlodipine 5 mg daily\nMetformin 500 mg BID\nAcetaminophen 650 mg TID PRN\nLorazepam 0.5 mg HS',sdm:'Daughter: Jane Sample 519-555-0102',notes:'SAMPLE RECORD for demonstration only.'};
  const p2={id:'p-002',owner_id:o,created_at:t,updated_at:t,first_name:'Robert',last_name:'Example',dob:'1958-11-02',sex:'M',hcn:'',phone:'519-555-0110',email:'',address:'Petrolia, ON',setting:'Community (virtual)',facility:'',pcp:'None (unattached)',pharmacy_name:'Example Drug Mart',pharmacy_fax:'519-555-0198',allergies:'NKDA',problems:'COPD; Dyslipidemia',medications:'Tiotropium 18 mcg inh daily\nAtorvastatin 20 mg HS',sdm:'',notes:'SAMPLE RECORD for demonstration only.'};
  const today=new Date();const at=(h,m)=>{const d=new Date(today);d.setHours(h,m,0,0);return d.toISOString();};
  return {
    profiles:[{id:o,owner_id:o,display_name:'Nurse Practitioner (demo)',credentials:'NP-PHC, RN(EC)',cno_number:'0000000',signature_line:'Nurse Practitioner, PMP Healthcare Corp.',created_at:t}],
    patients:[p1,p2],

let needsPassword=false,authNotice='';
async function initAuth(){
  if(DEMO){demo.load();const s=sessionStorage.getItem('pmp_demo_session');if(s){session=JSON.parse(s);}return;}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const h=location.hash||'';
  // 1) Scanner-safe links: #/auth?token_hash=...&type=recovery|invite|magiclink. The token is only consumed when this page verifies it,
  //    so an email client's link-preview fetch cannot burn the one-time link (the hosted verify URL would).
  const th=h.match(/token_hash=([^&]+)/),tt=h.match(/[?&]type=(invite|recovery|magiclink|signup|email)/);
  if(th){
    const type=tt?tt[1]:'recovery';
    try{
      const {data,error}=await sb.auth.verifyOtp({token_hash:decodeURIComponent(th[1]),type});
      history.replaceState(null,'',location.pathname);
      if(error)throw error;
      needsPassword=(type==='invite'||type==='recovery');
      if(!needsPassword&&data&&data.session)await hydrate(data.session.user);
      sb.auth.onAuthStateChange(async(ev)=>{if(ev==='SIGNED_OUT'){session=null;render();}});
      return;
    }catch(ex){needsPassword=false;authNotice='This sign-in link is invalid or has already been used. Use "Forgot password?" below to get a fresh one.';}
  }else if(/error_description=/.test(h)){
    // 2) Error returned by the hosted verify endpoint (e.g. link already consumed by a mail scanner)
    const em=h.match(/error_description=([^&]+)/);
    authNotice=decodeURIComponent(em[1].replace(/\+/g,' '))+'. Use "Forgot password?" below to request a fresh link.';history.replaceState(null,'',location.pathname);
  }else if(/type=(invite|recovery|magiclink|signup)/.test(h)||/access_token=/.test(h)){
    // 3) Legacy implicit-flow links (#access_token=...&type=recovery)
    needsPassword=/type=(invite|recovery)/.test(h);
  }
  const {data}=await sb.auth.getSession();
  if(data.session){if(needsPassword){session=null;return;}await hydrate(data.session.user);}
  sb.auth.onAuthStateChange(async(ev,s)=>{if(ev==='SIGNED_OUT'){session=null;render();}if(ev==='PASSWORD_RECOVERY'){needsPassword=true;render();}});
}
function setPasswordView(){return `<div class="login"><form class="box" id="pw-form">
  <div class="brand"><span class="mark">NP</span>PMP Clinician Portal</div>
  <h2 style="font-size:1.4rem">Set your password</h2>
  <p class="muted small">Choose a strong password (12+ characters). You will set up two-factor authentication right after signing in.</p>
  <label>New password<input type="password" id="pw1" autocomplete="new-password" minlength="12" required></label>
  <label>Confirm password<input type="password" id="pw2" autocomplete="new-password" minlength="12" required></label>
  <div id="pw-err" class="notice bad hidden"></div>
  <button class="btn gold" type="submit" id="pw-btn">Save password and continue</button>
</form></div>`;}
function bindSetPassword(){$('#pw-form').addEventListener('submit',async e=>{e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value,err=$('#pw-err');err.classList.add('hidden');if(a.length<12)return(err.textContent='Use at least 12 characters.',err.classList.remove('hidden'));if(a!==b)return(err.textContent='Passwords do not match.',err.classList.remove('hidden'));$('#pw-btn').disabled=true;try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;needsPassword=false;history.replaceState(null,'',location.pathname+'#/settings');const {data}=await sb.auth.getUser();await hydrate(data.user);await audit('password_set','auth',data.user.id);toast('Password saved. Now set up two-factor authentication.');render();}catch(ex){err.textContent=ex.message||String(ex);err.classList.remove('hidden');}finally{const b2=$('#pw-btn');if(b2)b2.disabled=false;}});}
async function hydrate(user){
  let profile=null;
  try{const {data}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=data;}catch(e){}
  if(!profile){const {data}=await sb.from('profiles').insert({id:user.id,owner_id:user.id,display_name:user.email,credentials:'NP',cno_number:'',signature_line:'Nurse Practitioner, PMP Healthcare Corp.'}).select().single();profile=data;}
  session={user:{id:user.id,email:user.email},profile};
}
async function login(email,pw){
  if(DEMO){
    if(pw!=='demo-pmp')throw new Error('Demo password is demo-pmp');
    session={user:{id:'demo-user',email:email||'demo@pmphealthcare.ca'},profile:demo.db.profiles[0]};
    sessionStorage.setItem('pmp_demo_session',JSON.stringify(session));audit('login','auth',session.user.id);return {mfa:false};
  }
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal.nextLevel==='aal2'&&aal.currentLevel!=='aal2'){return {mfa:true};}
  await hydrate(data.user);await audit('login','auth',data.user.id);return {mfa:false};
}
async function verifyMfa(code){
  const {data:f}=await sb.auth.mfa.listFactors();const factor=f.totp[0];
  const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId:factor.id});if(e1)throw e1;
  const {error:e2}=await sb.auth.mfa.verify({factorId:factor.id,challengeId:ch.id,code});if(e2)throw e2;
  const {data}=await sb.auth.getUser();await hydrate(data.user);await audit('login_mfa','auth',data.user.id);
}
async function logout(){await audit('logout','auth',session?.user?.id);if(DEMO){sessionStorage.removeItem('pmp_demo_session');session=null;render();return;}await sb.auth.signOut();session=null;render();}

function notePdf(p,e){
  if(!window.jspdf){toast('PDF library not loaded.');throw new Error('jsPDF unavailable');}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'letter'});const c=CFG.clinic||{};let y=18;
  doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(c.name||'PMP Healthcare Corp.',18,y);doc.setFont('helvetica','normal');doc.setFontSize(9);y+=5;doc.text(`${c.address||''}   Tel ${c.phone||'—'}   Fax ${c.fax||'—'}   ${c.email||''}`,18,y);y+=4;doc.setDrawColor(200);doc.line(18,y,198,y);y+=7;
  doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text(e.title||e.type,18,y);y+=6;doc.setFontSize(9);doc.setFont('helvetica','normal');
  doc.text(`Patient: ${p.last_name}, ${p.first_name}   DOB ${p.dob||'—'}   ${p.facility?'Facility: '+p.facility:''}`,18,y);y+=5;doc.text(`Encounter: ${fmtDT(e.created_at)}   Type: ${e.type}`,18,y);y+=7;
  doc.setFontSize(10);const lines=doc.splitTextToSize(e.body||'',175);
  for(const ln of lines){if(y>255){doc.addPage();y=18;}doc.text(ln,18,y);y+=5;}
  (e.addenda||[]).forEach(a=>{if(y>240){doc.addPage();y=18;}y+=3;doc.setFont('helvetica','bold');doc.text(`Addendum ${fmtDT(a.at)} · ${a.by}`,18,y);y+=5;doc.setFont('helvetica','normal');for(const ln of doc.splitTextToSize(a.text,175)){if(y>255){doc.addPage();y=18;}doc.text(ln,18,y);y+=5;}});
  if(y>240){doc.addPage();y=18;}y+=6;doc.setFont('helvetica','bold');doc.text(`${e.signed_by||''}`,18,y);y+=5;doc.setFont('helvetica','normal');doc.text(`Nurse Practitioner · CNO Reg. No. ${session.profile?.cno_number||''} · Electronically signed ${fmtDT(e.signed_at)}`,18,y);
  doc.setFontSize(8);doc.setTextColor(110);doc.text('Confidential personal health information (PHIPA, Ontario). Intended only for the addressee. If received in error, notify the sender and destroy.',18,268,{maxWidth:180});
  return doc;
}

async function drawThread(el,t,p,list){

function invPill(i){return {draft:'<span class="pill mute">Draft</span>',sent:'<span class="pill info">Sent</span>',overdue:'<span class="pill bad">Overdue</span>',paid:'<span class="pill ok">Paid</span>',void:'<span class="pill mute">Void</span>',refunded:'<span class="pill warn">Refunded</span>'}[i.status]||esc(i.status);}

  $$('[data-receipt]',root).forEach(x=>x.addEventListener('click',()=>{const inv=invs.find(i=>i.id===x.dataset.receipt);const p=pts.find(z=>z.id===inv.patient_id);try{receiptPdf(p,inv).output('dataurlnewwindow');}catch(e){}}));
  $$('[data-void]',root).forEach(x=>x.addEventListener('click',async()=>{await DB.update('invoices',x.dataset.void,{status:'void'});render();}));
}

function scoreSummary(k,v){const bits=[];if(k==='cga'){if(v.moca)bits.push(`MoCA ${v.moca}/30`);if(v.cfs)bits.push(`CFS ${v.cfs}`);if(v.gds)bits.push(`GDS ${v.gds}/15`);if(v.adl)bits.push(`ADL ${v.adl}/6`);if(v.tug)bits.push(`TUG ${v.tug}s`);}if(k==='medrev'){const n=(v.meds||'').split('\n').filter(s=>s.trim()).length;if(n)bits.push(`${n} medications`);if(v.acb)bits.push(`ACB ${v.acb}`);}if(k==='falls'){if(Array.isArray(v.rf))bits.push(`${v.rf.length} risk factors`);if(v.tug)bits.push(`TUG ${v.tug}s`);}if(k==='capacity'&&v.finding)bits.push(v.finding);return bits.join(' · ');}

  ${reqs.length?reqs.map(r=>`<div class="card" style="margin-bottom:1rem"><div class="card-h"><div><h3>${esc(r.name)} <span class="pill ${r.status==='new'?'warn':r.status==='booked'?'ok':'mute'}">${esc(r.status)}</span></div><div class="small muted">${fmtDT(r.created_at)} · ${esc(r.role||'')} · ${esc(r.request_type||'')}</div></div><div class="row"><a class="btn sm ghost" href="mailto:${esc(r.email)}?subject=${encodeURIComponent('PMP Healthcare: your appointment request')}">Reply by email</a>${r.status==='new'?`<button class="btn sm" data-book="${r.id}">Create patient &amp; book</button><button class="btn sm ghost" data-close="${r.id}">Close</button>`:''}</div></div><div class="card-b small"><div><b>Email</b> ${esc(r.email||'')} · <b>Phone</b> ${esc(r.phone||'')}</div><div class="note" style="margin-top:.4rem">${esc(r.message||'')}</div></div></div>`).join(''):'<div class="card empty">No requests yet. When the website form is connected (DEPLOY.md step 6), submissions appear here with a push to your email.</div>'}`;
  $$('[data-close]',m).forEach(x=>x.addEventListener('click',async()=>{await DB.update('web_requests',x.dataset.close,{status:'closed'});render();}));
  $$('[data-book]',m).forEach(x=>x.addEventListener('click',async()=>{const r=reqs.find(z=>z.id===x.dataset.book);const parts=(r.name||'').trim().split(/\s+/);const first=parts.shift()||'',last=parts.join(' ')||'(unknown)';const isSelf=/patient/i.test(r.role||'');const p=await DB.insert('patients',{first_name:isSelf?first:'',last_name:isSelf?last:'',phone:isSelf?r.phone:'',email:isSelf?r.email:'',setting:'Community (virtual)',sdm:isSelf?'':`${r.name} ${r.phone||''} ${r.email||''}`.trim(),notes:`From web request ${fmtD(r.created_at)}: ${r.message||''}`,allergies:'',problems:'',medications:''});await DB.update('web_requests',r.id,{status:'booked',patient_id:p.id});toast(isSelf?'Patient created':'Patient shell created (family contact saved as SDM); add the patient\'s own details');location.hash='#/patient/'+p.id;}));
}

/* ================= AUDIT ================= */
async function pageAudit(m){
  const log=(await DB.list('audit_log')).slice(0,300);
  m.innerHTML=`<div class="page-h"><div><h1>Audit log</h1><div class="sub">Append-only record of access and changes (latest 300)</div></div></div>
  <div class="card"><div class="table-wrap"><table class="audit"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Table</th><th>Record</th><th>Detail</th></tr></thead><tbody>${log.length?log.map(l=>`<tr><td class="mono">${fmtDT(l.created_at)}</td><td>${esc(l.actor||l.actor_email||'')}</td><td>${esc(l.action)}</td><td>${esc(l.table_name||'')}</td><td class="mono">${esc((l.row_id||'').toString().slice(0,8))}</td><td>${l.meta?esc(JSON.stringify(l.meta)):''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Empty.</td></tr>'}</tbody></table></div></div>`;
}

/* ================= SETTINGS ================= */
async function pageSettings(m){
  const pr=session.profile||{};
  m.innerHTML=`<div class="page-h"><div><h1>Settings</h1><div class="sub">Prescriber details, security and backend</div></div></div>
  <div class="grid g2">
   <div class="card"><div class="card-h"><h3>Prescriber</h3></div><div class="card-b form">
    <label>Display name (appears on notes and prescriptions)<input id="st-name" value="${esc(pr.display_name||'')}"></label>
    <div class="g2"><label>Credentials<input id="st-cred" value="${esc(pr.credentials||'')}" placeholder="NP-PHC, RN(EC)"></label><label>CNO registration number<input id="st-cno" value="${esc(pr.cno_number||'')}"></label></div>
    <label>Signature line<input id="st-sig" value="${esc(pr.signature_line||'')}"></label>
    <div class="row" style="justify-content:flex-end"><button class="btn gold" id="st-save">Save</button></div></div></div>
   <div class="card"><div class="card-h"><h3>Security</h3></div><div class="card-b form">
    ${DEMO?'<div class="notice warn">Two-factor authentication is enforced in the real backend (TOTP via authenticator app). Not available in demo mode.</div>':`<div id="mfa-area"><p class="small muted">Two-factor authentication with an authenticator app (Google Authenticator, Microsoft Authenticator, 1Password).</p><button class="btn" id="mfa-enroll">Set up / manage 2FA</button></div>`}
    <div class="small muted">Sessions expire after inactivity. Every sign-in, view of a document, signature and fax is written to the audit log.</div>
    <div class="row"><button class="btn ghost" id="st-export">Export my data (JSON)</button>${DEMO?'<button class="btn danger" id="st-reset">Reset demo data</button>':''}</div></div></div>
   <div class="card" style="grid-column:1/-1"><div class="card-h"><h3>Backend</h3><span class="pill ${DEMO?'warn':'ok'}">${DEMO?'Demo mode':'Connected'}</span></div><div class="card-b small">
    ${DEMO?`<p>This portal is running without a server. To make it real, follow <b>DEPLOY.md</b>: create a Supabase project in the Canada Central region, run <code>supabase/schema.sql</code>, deploy the four server functions, then paste the project URL and anon key into <code>PMP_CONFIG</code> at the top of <code>index.html</code>. The app switches out of demo mode automatically.</p>`:`<p>Supabase project: <code>${esc(CFG.supabaseUrl)}</code>. Storage bucket <code>documents</code>. Functions: send-fax, fax-inbox, create-video-room, web-request, secure-message-send/-access, create-payment, stripe-webhook.</p>`}
    <table style="margin-top:.6rem"><tbody>
     <tr><td>Database, auth, file storage</td><td>${DEMO?'<span class="pill warn">Browser only</span>':'<span class="pill ok">Supabase (Canada Central)</span>'}</td></tr>

     <tr><td>Video</td><td><span class="pill ${DEMO?'warn':'info'}">${DEMO?'Interim: Jitsi rooms':'Daily if DAILY_API_KEY set, else Jitsi interim'}</span></td></tr>
     <tr><td>Website intake</td><td><span class="pill ${DEMO?'warn':'info'}">${DEMO?'Not connected':'web-request function'}</span></td></tr>
     <tr><td>Secure messaging (patient link + DOB)</td><td><span class="pill ${DEMO?'warn':'info'}">${DEMO?'Simulated':'secure-message-send / -access; email via RESEND_API_KEY'}</span></td></tr>
     <tr><td>Payments</td><td><span class="pill ok">Interac e-Transfer to ${esc(CFG.payments?.etransferEmail||'clinic@pmphealthcare.ca')}${CFG.payments?.autodeposit?' · Autodeposit':''}</span> <span class="pill mute">Card links off (Stripe later)</span></td></tr>
     <tr><td>Fax server (PMP FaxGate, own modem + line)</td><td><span class="pill ${DEMO?'warn':'info'}">${DEMO?'Install on iMac (primary) + MacBook (standby): faxgate/README.md':'provider self · iMac primary, MacBook standby · fax-to-email and email-to-fax'}</span></td></tr>
     <tr><td>Notifications (email + text to cell)</td><td><span class="pill ${DEMO?'warn':'info'}">${DEMO?'Zoho SMTP + carrier SMS gateway: set SMTP_* and NOTIFY_SMS secrets':'Zoho SMTP · carrier SMS gateway'}</span></td></tr>
    </tbody></table></div></div>
  </div>`;
  $('#st-save').addEventListener('click',async()=>{const patch={display_name:$('#st-name').value.trim(),credentials:$('#st-cred').value.trim(),cno_number:$('#st-cno').value.trim(),signature_line:$('#st-sig').value.trim()};if(DEMO){Object.assign(demo.db.profiles[0],patch);demo.save();session.profile=demo.db.profiles[0];sessionStorage.setItem('pmp_demo_session',JSON.stringify(session));}else{const {data,error}=await sb.from('profiles').update(patch).eq('id',session.user.id).select().single();if(error)return toast(error.message);session.profile=data;}await audit('update','profiles',session.user.id);toast('Saved');});
  $('#st-export').addEventListener('click',async()=>{const out={};for(const t of TABLES){try{out[t]=await DB.list(t);}catch(e){}}const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pmp-portal-export-${new Date().toISOString().slice(0,10)}.json`;a.click();await audit('export','all','');});
  $('#st-reset')?.addEventListener('click',()=>{localStorage.removeItem(demo.key);sessionStorage.removeItem('pmp_demo_session');location.reload();});
  $('#mfa-enroll')?.addEventListener('click',async()=>{const {data:f}=await sb.auth.mfa.listFactors();if(f.totp.length){const mm=modal(`<h2>Two-factor authentication</h2><div class="notice ok">2FA is enabled on this account.</div><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="c">Close</button></div>`);$('#c',mm).addEventListener('click',closeModal);return;}const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'PMP Portal'});if(error)return toast(error.message);const mm=modal(`<h2>Set up two-factor authentication</h2><p class="small">Scan with your authenticator app, then enter the 6-digit code.</p><div style="text-align:center">${data.totp.qr_code}</div><p class="small muted">Manual key: <code>${esc(data.totp.secret)}</code></p><label>Code<input id="mfa-code" inputmode="numeric" maxlength="6"></label><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="c">Cancel</button><button class="btn gold" id="ok">Verify</button></div>`);$('#c',mm).addEventListener('click',closeModal);$('#ok',mm).addEventListener('click',async()=>{const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId:data.id});if(e1)return toast(e1.message);const {error:e2}=await sb.auth.mfa.verify({factorId:data.id,challengeId:ch.id,code:$('#mfa-code',mm).value.trim()});if(e2)return toast(e2.message);await audit('mfa_enrolled','auth',session.user.id);closeModal();toast('2FA enabled');});});
}

/* ================= BOOT ================= */
(async()=>{try{await initAuth();}catch(e){console.error(e);}render();})();
})();
</script>
</body>
